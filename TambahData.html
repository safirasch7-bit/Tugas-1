        <h1 style="text-align: center; margin-top: 32px"> Formulir Pendataan Mahasiswa</h1>
    <form style="background-color: whitesmoke; margin: auto; border-radius: 15px; padding: 20px; width: 80%">
        <div class="mb-3"> 
            <label for="exampleFormControlInput1" class="form-label">Nama Lengkap Mahasiswa</label>
            <input type="text" name="nama" class="form-control">
        </div>
       <div class="margin-bottom: 5px"> 
            <label for="exampleFormControlInput2" class="form-label">Angkatan</label>
            <input type="number" name="angkatan" class="form-control">
        </div>

        <label style="margin: 10px">Gender</label>
        <br />
        <div class="form-check">
            <input class="form-check-input" type="radio" name="radioDefault" id="radioDefault1" value="Perempuan">
            <label class="form-check-label" for="radioDefault1">
                Perempuan
            </label>
        </div>
        <div class="form-check">
            <input class="form-check-input" type="radio" name="radioDefault" id="radioDefault2" value="Laki-laki">
            <label class="form-check-label" for="radioDefault2">
                Laki-laki
            </label>
        </div>

        <label style="margin: 10px">Kesibukan</label>
        <br />
        <div class="form-check">
            <input class="form-check-input" type="checkbox" value="magang" id="checkDefault">
            <label class="form-check-label" for="checkDefault">
                Magang
            </label>
        </div>
            
        <div class="form-check">
            <input class="form-check-input" type="checkbox" value="asisten lab" id="checkChecked1">
            <label class="form-check-label" for="checkChecked1">
                Asisten Lab
            </label>
        </div>

        <div class="form-check">
            <input class="form-check-input" type="checkbox" value="lomba" id="checkChecked2">
            <label class="form-check-label" for="checkChecked2">
                Lomba
            </label>
        </div>

        <div class="form-check">
            <input class="form-check-input" type="checkbox" value="organisasi kampus" id="checkChecked3">
            <label class="form-check-label" for="checkChecked3">
                Organisasi Kampus
            </label>
        </div>

        <div class="button" style="margin-top: 10px">
            <button type="button" class="btn btn-dark">+ Tambah Data</button>
        </div>
    </form>
